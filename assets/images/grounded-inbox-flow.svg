<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Helvetica, Arial, sans-serif">
  <title>Data flow of the grounded inbox</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <style>
      .pred  { fill: #d9f3f0; stroke: #2a9d8f; stroke-width: 2; }
      .code  { fill: #f0f0f0; stroke: #888; stroke-width: 2; }
      .data  { fill: #fff; stroke: #555; stroke-width: 1.5; }
      .name  { font-size: 16px; font-weight: bold; fill: #222; text-anchor: middle; }
      .kind  { font-size: 12px; fill: #555; text-anchor: middle; }
      .label { font-size: 13px; font-style: italic; fill: #333; }
      .flow  { fill: none; stroke: #555; stroke-width: 1.6; marker-end: url(#arrow); }
      .line  { fill: none; stroke: #555; stroke-width: 1.6; }
    </style>
  </defs>
  <rect x="0" y="0" width="980" height="470" fill="#fefefe"/>

  <!-- data: the email -->
  <rect class="data" x="20" y="42" width="110" height="56" rx="28"/>
  <text class="name" x="75" y="75">email</text>

  <!-- the email feeds three steps -->
  <path class="line" d="M 130 70 H 170 V 330"/>
  <circle cx="170" cy="70" r="3" fill="#555"/>
  <circle cx="170" cy="200" r="3" fill="#555"/>
  <path class="flow" d="M 170 70 H 210"/>
  <path class="flow" d="M 170 200 H 210"/>
  <path class="flow" d="M 170 330 H 210"/>

  <!-- triage -->
  <rect class="pred" x="210" y="38" width="170" height="64" rx="8"/>
  <text class="name" x="295" y="66">triage</text>
  <text class="kind" x="295" y="86">Predict</text>

  <!-- extract -->
  <rect class="pred" x="210" y="168" width="170" height="64" rx="8"/>
  <text class="name" x="295" y="196">extract</text>
  <text class="kind" x="295" y="216">Predict, bug reports only</text>
  <path class="flow" d="M 380 200 H 430"/>
  <rect class="data" x="430" y="185" width="76" height="30" rx="15"/>
  <text class="label" x="468" y="205" text-anchor="middle">ticket</text>

  <!-- search -->
  <rect class="code" x="210" y="298" width="170" height="64" rx="8"/>
  <text class="name" x="295" y="326">search</text>
  <text class="kind" x="295" y="346">retriever, k = 3</text>

  <!-- knowledge base -->
  <rect class="data" x="210" y="404" width="170" height="50" rx="8"/>
  <text class="name" x="295" y="427" style="font-size:14px">knowledge base</text>
  <text class="kind" x="295" y="444">32 passages</text>
  <path class="flow" d="M 295 404 V 363"/>

  <!-- triage outputs -->
  <path class="flow" d="M 380 62 H 855 V 297"/>
  <text class="label" x="690" y="54">urgency</text>
  <path class="flow" d="M 380 82 H 560 V 297"/>
  <text class="label" x="440" y="100">category</text>

  <!-- search to draft -->
  <path class="flow" d="M 380 330 H 499"/>
  <text class="label" x="440" y="322" text-anchor="middle">context</text>
  <text class="kind" x="440" y="348">3 passages</text>

  <!-- draft -->
  <rect class="pred" x="500" y="298" width="170" height="64" rx="8"/>
  <text class="name" x="585" y="326">draft</text>
  <text class="kind" x="585" y="346">ChainOfThought</text>

  <!-- the email also feeds draft -->
  <rect class="data" x="587" y="412" width="76" height="30" rx="15"/>
  <text class="label" x="625" y="432" text-anchor="middle">email</text>
  <path class="flow" d="M 625 412 V 363"/>

  <!-- draft to prefix -->
  <path class="flow" d="M 670 330 H 759"/>
  <text class="label" x="714" y="322" text-anchor="middle">reply</text>

  <!-- prefix -->
  <rect class="code" x="760" y="298" width="190" height="64" rx="8"/>
  <text class="name" x="855" y="326" style="font-size:14px">add [PRIORITY]</text>
  <text class="kind" x="855" y="346">when urgency is high</text>

  <!-- final reply -->
  <path class="flow" d="M 855 362 V 403"/>
  <rect class="data" x="760" y="404" width="190" height="50" rx="25"/>
  <text class="name" x="855" y="434" style="font-size:14px">reply to the customer</text>

  <!-- legend -->
  <rect class="pred" x="20" y="392" width="18" height="18" rx="3"/>
  <text x="46" y="406" font-size="12" fill="#333">predictor: calls the model</text>
  <rect class="code" x="20" y="418" width="18" height="18" rx="3"/>
  <text x="46" y="432" font-size="12" fill="#333">plain Python</text>
  <rect class="data" x="20" y="444" width="18" height="18" rx="9"/>
  <text x="46" y="458" font-size="12" fill="#333">data</text>
</svg>
